<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGlow" cx="20%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1035" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#0c0a17" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05040a" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="gemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#ec4899;#a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Crystal Facet Gradients (App Color Identity) -->
    <!-- Crown Left (Light Catching) -->
    <linearGradient id="facetCrownLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Crown Right (Deep Purple) -->
    <linearGradient id="facetCrownRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Girdle Left (Cyan/Neon Reflection) -->
    <linearGradient id="facetGirdleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Girdle Right (Shadow Reflection) -->
    <linearGradient id="facetGirdleRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="60%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Pavilion Left (Bottom Refraction) -->
    <linearGradient id="facetPavilionLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Pavilion Right (Bottom Depth) -->
    <linearGradient id="facetPavilionRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="60%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e0538" />
    </linearGradient>

    <!-- Animated Border Laser Gradient -->
    <linearGradient id="borderLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#ec4899;#a855f7" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#a855f7;#06b6d4" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#a855f7;#06b6d4;#ec4899" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Chrome Gradient -->
    <linearGradient id="chromeTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f3e8ff" />
      <stop offset="55%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="crystalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="36" />
    </filter>

    <!-- Card Clip Path -->
    <clipPath id="roundedCard">
      <rect x="0" y="0" width="1280" height="420" rx="26" ry="26" />
    </clipPath>
  </defs>

  <!-- Card Body -->
  <g clip-path="url(#roundedCard)">
    <!-- Base Deep Background -->
    <rect width="1280" height="420" fill="#06050b" />
    <rect width="1280" height="420" fill="url(#spaceGlow)" />

    <!-- Isometric Sci-Fi Perspective Grid -->
    <g opacity="0.07" stroke="#9333ea" stroke-width="1">
      <line x1="0" y1="70" x2="1280" y2="70" />
      <line x1="0" y1="140" x2="1280" y2="140" />
      <line x1="0" y1="210" x2="1280" y2="210" />
      <line x1="0" y1="280" x2="1280" y2="280" />
      <line x1="0" y1="350" x2="1280" y2="350" />
      <line x1="160" y1="0" x2="160" y2="420" />
      <line x1="320" y1="0" x2="320" y2="420" />
      <line x1="480" y1="0" x2="480" y2="420" />
      <line x1="640" y1="0" x2="640" y2="420" />
      <line x1="800" y1="0" x2="800" y2="420" />
      <line x1="960" y1="0" x2="960" y2="420" />
      <line x1="1120" y1="0" x2="1120" y2="420" />
    </g>

    <!-- Ambient Floating Nebulas -->
    <circle cx="210" cy="210" r="160" fill="#9333ea" opacity="0.35" filter="url(#deepBlur)">
      <animate attributeName="r" values="140;180;140" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.4;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1150" cy="90" r="130" fill="#06b6d4" opacity="0.2" filter="url(#deepBlur)" />
    <circle cx="1000" cy="330" r="120" fill="#ec4899" opacity="0.18" filter="url(#deepBlur)" />

    <!-- Top HUD Coordinates & Status -->
    <g transform="translate(60, 36)" opacity="0.7">
      <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#a855f7" letter-spacing="2">SYS.CORE // TAURI v2.0</text>
      <text x="210" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#06b6d4" letter-spacing="2">NATIVE RUST 2021</text>
      <text x="400" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#10b981" letter-spacing="2">RAM: ~60MB IDLE</text>
    </g>

    <g transform="translate(1090, 36)" opacity="0.8">
      <circle cx="0" cy="-3" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="14" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5">ONLINE • EDGE</text>
    </g>

    <!-- ======================================================== -->
    <!-- LEFT SIDE: THE AUTHENTIC NEXUS FACETED CRYSTAL GEM ICON  -->
    <!-- ======================================================== -->
    <g transform="translate(70, 55)">
      <!-- Animated Levitation Group -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4.5s" repeatCount="indefinite" ease="easeInOut" />

        <!-- Radial Aura Behind Gem -->
        <circle cx="145" cy="150" r="130" fill="url(#gemAura)" />

        <!-- Floating Glass Hexagon Pedestal -->
        <polygon points="145,20 250,85 250,215 145,280 40,215 40,85" fill="#110d24" fill-opacity="0.6" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.4" />

        <!-- Inner Ambient Ring -->
        <circle cx="145" cy="150" r="88" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 6" opacity="0.4">
          <animateTransform attributeName="transform" type="rotate" from="0 145 150" to="360 145 150" dur="20s" repeatCount="indefinite" />
        </circle>

        <!-- THE EXACT NEXUS GEM (Scaled to 0.58 on 512x512 canvas -> ~240px) -->
        <g transform="translate(-5, 0) scale(0.58)" filter="url(#crystalGlow)">
          <!-- Facet 1: Crown Left -->
          <polygon points="256,60 256,256 98,256" fill="url(#facetCrownLeft)" />
          
          <!-- Facet 2: Crown Right -->
          <polygon points="256,60 414,256 256,256" fill="url(#facetCrownRight)" />
          
          <!-- Facet 3: Girdle Left -->
          <polygon points="98,256 256,256 170,340" fill="url(#facetGirdleLeft)" />
          
          <!-- Facet 4: Girdle Right -->
          <polygon points="256,256 414,256 342,340" fill="url(#facetGirdleRight)" />
          
          <!-- Facet 5: Pavilion Left -->
          <polygon points="98,256 170,340 256,452" fill="url(#facetPavilionLeft)" />
          
          <!-- Facet 6: Pavilion Right -->
          <polygon points="414,256 256,452 342,340" fill="url(#facetPavilionRight)" />

          <!-- High-Tech Sharp Facet Outlines -->
          <polygon points="256,60 414,256 256,452 98,256" fill="none" stroke="#090814" stroke-width="12" stroke-linejoin="round" />
          <line x1="98" y1="256" x2="414" y2="256" stroke="#090814" stroke-width="10" />
          <line x1="256" y1="60" x2="256" y2="256" stroke="#090814" stroke-width="8" />
          <line x1="170" y1="340" x2="256" y2="256" stroke="#090814" stroke-width="8" />
          <line x1="342" y1="340" x2="256" y2="256" stroke="#090814" stroke-width="8" />
          <line x1="170" y1="340" x2="256" y2="452" stroke="#090814" stroke-width="8" />
          <line x1="342" y1="340" x2="256" y2="452" stroke="#090814" stroke-width="8" />

          <!-- Specular Shimmer Edge on Crown -->
          <line x1="256" y1="60" x2="98" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6">
            <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" />
          </line>
        </g>
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- RIGHT SIDE: BRANDING, TITLE & ADVANCED FEATURE PILLS     -->
    <!-- ======================================================== -->
    <g transform="translate(385, 95)">
      <!-- Main Title with Glowing Accent -->
      <g>
        <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Sora', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="url(#chromeTitle)">
          NEXUS
        </text>
        <text x="280" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Sora', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="url(#borderLaser)">
          LAUNCHER
        </text>
      </g>

      <!-- Subtitle -->
      <text x="3" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" letter-spacing="2.5" fill="#cbd5e1">
        THE NEXT-GENERATION PC GAME LIBRARY &amp; GAMING SUITE
      </text>

      <!-- Descriptive details -->
      <text x="4" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
        Ultra-Fast Native Core • Cloudflare Edge Metadata • 6-Module Game Booster • Built-in Music &amp; Downloads
      </text>

      <!-- Advanced Interactive Feature Pills (HUD Design) -->
      <g transform="translate(4, 165)">
        <!-- Pill 1: Game Booster -->
        <g>
          <rect x="0" y="0" width="148" height="42" rx="12" fill="#17112c" stroke="#a855f7" stroke-width="1.4" />
          <text x="74" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f3e8ff" text-anchor="middle">⚡ Game Booster</text>
        </g>

        <!-- Pill 2: Parallel Downloader -->
        <g transform="translate(160, 0)">
          <rect x="0" y="0" width="168" height="42" rx="12" fill="#0a1d2e" stroke="#06b6d4" stroke-width="1.4" />
          <text x="84" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#cffafe" text-anchor="middle">📥 6x Downloader</text>
        </g>

        <!-- Pill 3: Soundtrack Player -->
        <g transform="translate(340, 0)">
          <rect x="0" y="0" width="162" height="42" rx="12" fill="#290e23" stroke="#ec4899" stroke-width="1.4" />
          <text x="81" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fce7f3" text-anchor="middle">🎵 OST Visualizer</text>
        </g>

        <!-- Pill 4: Save Guardian -->
        <g transform="translate(514, 0)">
          <rect x="0" y="0" width="154" height="42" rx="12" fill="#0d241d" stroke="#10b981" stroke-width="1.4" />
          <text x="77" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">🛡️ Save Guardian</text>
        </g>

        <!-- Pill 5: Cloud Hub -->
        <g transform="translate(680, 0)">
          <rect x="0" y="0" width="144" height="42" rx="12" fill="#261b0c" stroke="#f59e0b" stroke-width="1.4" />
          <text x="72" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fef3c7" text-anchor="middle">🎮 Cloud Hub</text>
        </g>
      </g>

      <!-- Live Audio Wave Graphic (Animated Sound Bars) -->
      <g transform="translate(4, 235)" opacity="0.65">
        <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">AUDIO SPECTRUM:</text>
        <g transform="translate(125, 0)">
          <rect x="0" y="2" width="3" height="12" rx="1.5" fill="#a855f7"><animate attributeName="height" values="4;14;6;16;4" dur="1.2s" repeatCount="indefinite" /></rect>
          <rect x="7" y="2" width="3" height="10" rx="1.5" fill="#a855f7"><animate attributeName="height" values="8;16;4;12;8" dur="1s" repeatCount="indefinite" /></rect>
          <rect x="14" y="2" width="3" height="14" rx="1.5" fill="#06b6d4"><animate attributeName="height" values="14;4;16;6;14" dur="1.4s" repeatCount="indefinite" /></rect>
          <rect x="21" y="2" width="3" height="8" rx="1.5" fill="#06b6d4"><animate attributeName="height" values="6;16;8;14;6" dur="0.9s" repeatCount="indefinite" /></rect>
          <rect x="28" y="2" width="3" height="16" rx="1.5" fill="#ec4899"><animate attributeName="height" values="12;6;16;4;12" dur="1.1s" repeatCount="indefinite" /></rect>
          <rect x="35" y="2" width="3" height="6" rx="1.5" fill="#ec4899"><animate attributeName="height" values="4;12;6;16;4" dur="1.3s" repeatCount="indefinite" /></rect>
          <rect x="42" y="2" width="3" height="12" rx="1.5" fill="#10b981"><animate attributeName="height" values="10;4;14;8;10" dur="1s" repeatCount="indefinite" /></rect>
          <rect x="49" y="2" width="3" height="15" rx="1.5" fill="#10b981"><animate attributeName="height" values="15;8;4;16;15" dur="1.5s" repeatCount="indefinite" /></rect>
        </g>
        <text x="195" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">ARCH: x86_64 • OFFLINE FIRST • ACID JOURNAL</text>
      </g>
    </g>

    <!-- Outer Animated Laser Border -->
    <rect x="1.5" y="1.5" width="1277" height="417" rx="24.5" fill="none" stroke="url(#borderLaser)" stroke-width="2.5" opacity="0.85" />
  </g>
</svg>
