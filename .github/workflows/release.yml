name: Release & Auto-Update Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate, Lint & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate version synchronization
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const tauri = require('./src-tauri/tauri.conf.json');
            const ref = process.env.GITHUB_REF_NAME || '';
            const tagVer = ref.replace(/^v/, '');
            console.log('Validating versions: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', tag=' + ref);
            if (pkg.version !== tauri.version) {
              console.error('ERROR: Mismatch between package.json (' + pkg.version + ') and tauri.conf.json (' + tauri.version + ')');
              process.exit(1);
            }
            if (ref.startsWith('v') && tagVer !== pkg.version) {
              console.error('ERROR: Git tag (' + ref + ') does not match version in config files (' + pkg.version + ')');
              process.exit(1);
            }
            console.log('Version synchronization check passed: v' + pkg.version);
          "

      - name: Run ESLint / Oxlint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc -b

      - name: Run Frontend Unit Tests (Vitest)
        run: npm test

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend production build
        run: npm run build

  build-and-release:
    name: Build Signed Artifacts & Publish (${{ matrix.platform }})
    needs: validate-and-test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      # Optional Authenticode signing certificate preparation if configured in repository secrets
      - name: Setup Windows Authenticode Certificate (Optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          Write-Host "Authenticode certificate secret detected. Decoding certificate..."
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:TEMP\authenticode.pfx", $certBytes)
          Write-Host "Importing certificate into current user store..."
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $pfx.Import("$env:TEMP\authenticode.pfx", $env:WINDOWS_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)

      - name: Prepare Tauri signing key (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RAW_KEY) {
            $cleanKey = $env:RAW_KEY.Trim()
            $keyPath = "$env:RUNNER_TEMP\nexus-updater.key"
            [System.IO.File]::WriteAllText($keyPath, $cleanKey)
            Write-Host "Sanitized signing key written to $keyPath"
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare Tauri signing key (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$RAW_KEY" ]; then
            CLEAN_KEY="$(echo "$RAW_KEY" | tr -d '\r')"
            KEY_PATH="$RUNNER_TEMP/nexus-updater.key"
            printf "%s" "$CLEAN_KEY" > "$KEY_PATH"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
          fi

      - name: Build, Sign and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Launcher ${{ github.ref_name }}'
          retryAttempts: 3
          updaterJsonPreferNsis: true
          releaseBody: |
            # 🚀 Nexus Game Launcher ${{ github.ref_name }} — Deep System Tweaks & Storage Clean Up Engine Release

            نسخه رسمی **۰.۶.۰** لانچر نکسوس با قابلیت‌های پیشرفته **توییک‌های سیستمی ویندوز (Windows System Tweaks)**، فعال‌سازی **تایمر فوق‌دقیق ۰.۵ میلی‌ثانیه‌ای (0.5ms High-Resolution Timer)**، **موتور پاکسازی هوشمند حافظه (Storage Clean Up Engine)** با حفاظت ۱۰۰٪ از سیوهای فعال، **بازطراحی ماژولار پاپ‌آپ بوست اجرای بازی** هماهنگ با تم دارک و لایت، رفع کامل تداخل فیلترهای چندگانه گیم هاب و بسته‌های پایدار نصبی برای ویندوز و لینوکس منتشر شد!
            The official **v0.6.0** release of Nexus Game Launcher introduces **Deep Windows System Tweaks & Game Booster**, **0.5ms High-Resolution Multimedia Timer (NtSetTimerResolution)** for ultra-low latency, **Smart Storage Clean Up Engine** with active game saves protection and Master Select All, **Redesigned Launch Boost Modal** with sound FX and full Light/Dark mode polish, Game Hub multi-filter logical intersection fixes, and updated packages for Windows and Linux!

            ---

            ### ⚡ توییک‌های سیستمی و بوستر فوق‌پیشرفته (Deep System Tweaks & Game Booster)

            - ⏱️ **تایمر فوق‌دقیق ۰.۵ میلی‌ثانیه‌ای (0.5ms High-Resolution Timer):**
              - فراخوانی مستقیم API بومی `NtSetTimerResolution` در هسته ویندوز جهت کاهش فرکانس تایمر از ۱۵.۶ میلی‌ثانیه استاندارد به ۰.۵ میلی‌ثانیه برای به حداقل رساندن تأخیر ورودی کیبورد/موس و حذف کامل میکرو استاترها (Micro-Stutters).
            - 🎯 **اولویت پردازشی بلادرنگ (Real-Time / High CPU Priority):**
              - تخصیص خودکار بالاترین اولویت پردازشی ویندوز به پروسه بازی به محض اجرا.
            - 🔋 **پاور پلن نهایی (Ultimate Performance Power Plan):**
              - فعال‌سازی خودکار طرح مصرف انرژی عملکرد نهایی ویندوز و خاموش کردن محدودکننده‌های حرارتی CPU در طول اجرای بازی.
            - 🎮 **حالت اختصاصی بازی ویندوز (Windows Game Mode):**
              - فعال‌سازی Game Mode ویندوز و هدایت تمامی توان کارت گرافیک به پنجره بازی.
            - 🧹 **پاکسازی آنی کش استندبای و حافظه رم (Standby List & RAM Flush):**
              - پاکسازی حافظه Standby List و Working Set رم قبل از اجرای هر بازی برای در اختیار گذاشتن حداکثر رم آزاد.

            ---

            ### 🧹 موتور هوشمند پاکسازی حافظه (Smart Storage Clean Up Engine)

            - 🛡️ **حفاظت هوشمند از سیوهای زنده (Live Saves Guard):**
              - ایزوله‌سازی و محافظت کامل از فایل‌های ذخیره بازی‌های موجود در کتابخانه کاربر بدون ریسک حذف تصادفی.
            - 🔍 **اسکن عمیق فایل‌های بدون استفاده (Deep Orphaned Files Scanner):**
              - اسکن پوشه‌های سیو بازی‌های حذف‌شده از سیستم، کش تصاویر و پوسترهای بدون استفاده، تاریخچه اسنپ‌شات‌های سیو و بافرهای موقت.
            - 📊 **رابط کاربری شیک و نوار Master Select All:**
              - تفکیک شفاف حجم‌ها بر اساس دسته‌بندی، انتخاب یکجا یا انتخابی، محاسبه لحظه‌ای فضای آزادشونده و هماهنگی کامل با پالت‌های رنگی و تم‌های تیره و روشن.

            ---

            ### 🎬 بازطراحی پاپ‌آپ بوست اجرای بازی (Launch Boost Modal Redesign)

            - 🚀 انیمیشن سایبرپانک چندمرحله‌ای برای پایش عملیات‌های بهینه‌سازی قبل از ورود به بازی.
            - 🔊 افکت‌های صوتی بومی موتور صدا در مراحل پاکسازی رم و اعمال تایمر.
            - 🌓 بهینه‌سازی دقیق رنگ‌ها، گرادینت‌ها و کادربندی برای حالت روشن (Light Mode) و حالت تاریک (Dark Mode).

            ---

            ### 🎯 رفع باگ فیلترهای چندگانه گیم هاب (Game Hub Multi-Filter Fix)

            - منطق اشتراک ریاضی (Logical AND) برای فیلترهای سبک و ژانر: بازی‌ها دقیقاً باید شامل تمامی تگ‌های انتخابی کاربر باشند تا نمایش داده شوند.

            ---

            ### 📦 راهنمای دانلود و نصب (Download & Installation)

            - 🪟 **ویندوز (Windows 10/11 x64):**
              - فایل نصبی `Nexus_0.6.0_x64-setup.exe` را دانلود کرده و با یک کلیک اجرا کنید.
              - کاربران فعلی در صورت باز بودن برنامه، اعلان به‌روزرسانی خودکار درون‌برنامه‌ای را دریافت خواهند کرد.

            - 🐧 **لینوکس (آرچ، مانجارو، استیم‌دک، فدورا، اوبونتو و تمام توزیع‌ها):**
              - **پکیج همه‌منظوره AppImage (پیشنهادی):**
                ```bash
                chmod +x Nexus_0.6.0_amd64.AppImage
                ./Nexus_0.6.0_amd64.AppImage
                ```
              - **پکیج دبیان و اوبونتو (.deb):**
                ```bash
                sudo dpkg -i nexus_0.6.0_amd64.deb
                ```
              - **پکیج فدورا و ردهت (.rpm):**
                ```bash
                sudo dnf install ./Nexus-0.6.0-1.x86_64.rpm
                ```
          releaseDraft: false
          prerelease: false
