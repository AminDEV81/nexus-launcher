name: Release & Auto-Update Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate, Lint & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate version synchronization
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const tauri = require('./src-tauri/tauri.conf.json');
            const ref = process.env.GITHUB_REF_NAME || '';
            const tagVer = ref.replace(/^v/, '');
            console.log('Validating versions: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', tag=' + ref);
            if (pkg.version !== tauri.version) {
              console.error('ERROR: Mismatch between package.json (' + pkg.version + ') and tauri.conf.json (' + tauri.version + ')');
              process.exit(1);
            }
            if (ref.startsWith('v') && tagVer !== pkg.version) {
              console.error('ERROR: Git tag (' + ref + ') does not match version in config files (' + pkg.version + ')');
              process.exit(1);
            }
            console.log('Version synchronization check passed: v' + pkg.version);
          "

      - name: Run ESLint / Oxlint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc -b

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend production build
        run: npm run build

  build-and-release:
    name: Build Signed Artifacts & Publish (${{ matrix.platform }})
    needs: validate-and-test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      # Optional Authenticode signing certificate preparation if configured in repository secrets
      - name: Setup Windows Authenticode Certificate (Optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          Write-Host "Authenticode certificate secret detected. Decoding certificate..."
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:TEMP\authenticode.pfx", $certBytes)
          Write-Host "Importing certificate into current user store..."
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $pfx.Import("$env:TEMP\authenticode.pfx", $env:WINDOWS_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)

      - name: Prepare Tauri signing key (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RAW_KEY) {
            $cleanKey = $env:RAW_KEY.Trim()
            $keyPath = "$env:RUNNER_TEMP\nexus-updater.key"
            [System.IO.File]::WriteAllText($keyPath, $cleanKey)
            Write-Host "Sanitized signing key written to $keyPath"
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare Tauri signing key (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$RAW_KEY" ]; then
            CLEAN_KEY="$(echo "$RAW_KEY" | tr -d '\r')"
            KEY_PATH="$RUNNER_TEMP/nexus-updater.key"
            printf "%s" "$CLEAN_KEY" > "$KEY_PATH"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
          fi

      - name: Build, Sign and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Launcher ${{ github.ref_name }}'
          retryAttempts: 3
          updaterJsonPreferNsis: true
          releaseBody: |
            # 🚀 Nexus Game Launcher ${{ github.ref_name }} — The Ultimate Gaming Overlay & Performance Release

            نسخه رسمی **۰.۵.۰** لانچر نکسوس با ماژول پرچمدار و انقلابی **اورلی گیمینگ (In-Game Overlay HUD)**، پایش عمیق تلمتری سخت‌افزار با ETW، سنجش فوق‌دقیق و بدون تاخیر FPS و Frametime، ۶ پوسته و چیدمان بصری HUD، نمودار زنده فریم‌تایم، سیستم هشدارهای سخت‌افزاری، اصلاح و یکپارچه‌سازی کامل تم لایت وب‌سایت و بسته‌های نصبی پایدار برای ویندوز و لینوکس منتشر شد!
            The official **v0.5.0** release of Nexus Game Launcher introduces our flagship **In-Game Gaming Overlay HUD**, microsecond-accurate ETW frame timing & FPS telemetry, 6 customizable HUD visual themes, live Frametime jitter graphs, non-intrusive hardware diagnostic alerts, full website light theme overhaul, and rock-solid production packages for Windows and Linux!

            ---

            ### 🎮 ماژول پرچمدار اورلی گیمینگ (Flagship In-Game Overlay HUD)

            - ⚡ **موتور سنجش فریم فوق‌دقیق بر پایه ETW (Zero-Injection Frame Timing):**
              - اندازه‌گیری فریم‌ها بدون کوچکترین افت کارایی (Zero Overhead) از طریق Event Tracing for Windows و ساب‌سیستم DXGI.
              - کاملاً ایمن در بازی‌های آنلاین با آنتی‌چیت‌های Easy Anti-Cheat, BattlEye, Vanguard و Ricochet به دلیل عدم تزریق هرگونه DLL.
              - سنجش لحظه‌ای FPS، میانگین فریم، شاخص‌های حیاتی 1% Low و 0.1% Low FPS و فریم‌تایم میکروثانیه‌ای (Frametime ms).

            - 📊 **سنسورهای عمیق تلمتری سخت‌افزار (Multi-Tier Hardware Diagnostics):**
              - **CPU:** درصد استفاده کل و تک‌تک هسته‌ها، دمای پردازنده (Tctl/Tdie)، فرکانس کلاک و توان مصرفی پردازنده (Watts).
              - **GPU:** درصد استفاده هسته گرافیکی، میزان حافظه ویدئویی (VRAM)، دمای هسته و هات‌اسپات، سرعت فن و اتصال به سنسورهای NVML و ADL/DXGI.
              - **RAM, Disk & Network:** رم مصرفی بازی و سیستم، سرعت خواندن/نوشتن دیسک، سرعت آپلود/دانلود و پینگ شبکه.
              - **Power & Battery:** درصد شارژ و سلامت باتری لپ‌تاپ‌های گیمینگ، نرخ دشارژ و تخمین زمان باقی‌مانده.

            - 🎨 **۶ پوسته و چیدمان بصری متنوع HUD (6 Customizable Themes & Layouts):**
              - شامل پوسته‌های Compact Badge (کپسولی و مینیاتوری)، Horizontal Bar (نوار افقی سایبرپانک)، Vertical Strip (ستونی)، Modular Cards (کارت‌های ماژولار)، Radial Gauges (عقربه‌ای سفینه‌ای) و Bracket HUD (زرهی).

            - 📈 **نمودار زنده فریم‌تایم (Live Frametime Graph):**
              - ترسیم ۶۰ فریم بر ثانیه نمودار زمانی فریم‌ها روی بوم Canvas با تشخیص بلادرنگ لگ و لکنت‌های ریز (Micro-Stutters).

            - 🔔 **سیستم هوشمند اخطار سلامت سخت‌افزار (Hardware Safety Alerts):**
              - اعلان هوشمند هنگام داغ شدن بیش از حد پردازنده یا گرافیک (>85°C/90°C) یا اشغال بحرانی حافظه رم.

            - ⌨️ **کلید میانبر سراسری و پنجره شناور شفاف (Global Hotkey & Click-Through):**
              - کلید پیش‌فرض `Ctrl+Shift+Z` برای باز و بسته کردن آنی اورلی با پنجره تمام‌شفاف کلیک‌ردشونده (WS_EX_TRANSPARENT) بدون تداخل با نشانه‌گیری موس.

            ---

            ### 🌓 بازطراحی و فیکس تم لایت وب‌سایت (Website Light Theme Redesign)

            - اصلاح ۱۰۰٪ کنتراست رنگ متون و کارت‌ها در تم لایت در سایت رسمی و داکیومنت‌ها.
            - اضافه شدن کارت پرچمدار Bento 9 جهت معرفی تعاملی اورلی به وب‌سایت.
            - ارتقای رابط کاربری پنجره انتخاب پکیج‌های لینوکس و کدهای ترمینال.

            ---

            ### ⚙️ بهینه‌سازی و پایداری هسته برنامه (Core Performance & Stability)

            - ارتقای معماری Rust و Tauri 2 به نگارش ۰.۵.۰ با مصرف رم فوق‌العاده پایین (~60-70MB).
            - مدیریت بهینه رجیستری هوت‌کی و یکپارچه‌سازی با فرآیند اجرای بازی‌ها.
            - امضای دیجیتال کامل تمام بسته‌ها برای فعال‌سازی سیستم آپدیت خودکار.

            ---

            ### 📦 راهنمای دانلود و نصب (Download & Installation)

            - 🪟 **ویندوز (Windows 10/11 x64):**
              - فایل نصبی `Nexus_0.5.0_x64-setup.exe` را دانلود کرده و با یک کلیک اجرا کنید.
              - کاربران فعلی در صورت باز بودن برنامه، اعلان به‌روزرسانی خودکار درون‌برنامه‌ای را دریافت خواهند کرد.

            - 🐧 **لینوکس (آرچ، مانجارو، استیم‌دک، فدورا، اوبونتو و تمام توزیع‌ها):**
              - **پکیج همه‌منظوره AppImage (پیشنهادی):**
                ```bash
                chmod +x Nexus_0.5.0_amd64.AppImage
                ./Nexus_0.5.0_amd64.AppImage
                ```
              - **پکیج دبیان و اوبونتو (.deb):**
                ```bash
                sudo dpkg -i nexus_0.5.0_amd64.deb
                ```
              - **پکیج فدورا و ردهت (.rpm):**
                ```bash
                sudo dnf install ./Nexus-0.5.0-1.x86_64.rpm
                ```
          releaseDraft: false
          prerelease: false
