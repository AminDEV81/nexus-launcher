name: Release & Auto-Update Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate, Lint & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate version synchronization
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const tauri = require('./src-tauri/tauri.conf.json');
            const ref = process.env.GITHUB_REF_NAME || '';
            const tagVer = ref.replace(/^v/, '');
            console.log('Validating versions: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', tag=' + ref);
            if (pkg.version !== tauri.version) {
              console.error('ERROR: Mismatch between package.json (' + pkg.version + ') and tauri.conf.json (' + tauri.version + ')');
              process.exit(1);
            }
            if (ref.startsWith('v') && tagVer !== pkg.version) {
              console.error('ERROR: Git tag (' + ref + ') does not match version in config files (' + pkg.version + ')');
              process.exit(1);
            }
            console.log('Version synchronization check passed: v' + pkg.version);
          "

      - name: Run ESLint / Oxlint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc -b

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend production build
        run: npm run build

  build-and-release:
    name: Build Signed Artifacts & Publish
    needs: validate-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      # Optional Authenticode signing certificate preparation if configured in repository secrets
      - name: Setup Windows Authenticode Certificate (Optional)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          Write-Host "Authenticode certificate secret detected. Decoding certificate..."
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:TEMP\authenticode.pfx", $certBytes)
          Write-Host "Importing certificate into current user store..."
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $pfx.Import("$env:TEMP\authenticode.pfx", $env:WINDOWS_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)

      - name: Prepare Tauri signing key
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RAW_KEY) {
            $cleanKey = $env:RAW_KEY.Trim()
            $keyPath = "$env:RUNNER_TEMP\nexus-updater.key"
            [System.IO.File]::WriteAllText($keyPath, $cleanKey)
            Write-Host "Sanitized signing key written to $keyPath"
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build, Sign and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Launcher ${{ github.ref_name }}'
          releaseBody: |
            # 🚀 Nexus Game Launcher ${{ github.ref_name }}

            نسخه جدید ۰.۲.۰ لانچر بازی نکسوس همراه با بهینه‌سازی‌های عمیق سخت‌افزاری و بهبودهای درخواستی منتشر شد!
            Welcome to **Nexus Game Launcher ${{ github.ref_name }}** featuring major GPU optimizations, enhanced game boost, and smarter Hub filtering!

            ---

            ### ⚡ ویژگی‌های جدید و بهبودهای نسخه ۰.۲.۰ (What's New in v0.2.0)

            - 🚀 **بهینه‌سازی عظیم مصرف کارت گرافیک (Massive GPU Optimization):**
              - کاهش مصرف GPU در حالت بیکار (Idle) از ۶۵٪ به زیر ۵٪ روی کارت‌های گرافیک قدرتمند (نظیر RX 6900 XT).
              - بازنویسی کامل انیمیشن‌ها، حذف افکت‌های سنگین `backdrop-filter` تودرتو و بهینه‌سازی بار رندرینگ.
              - توقف کامل ویژوالایزر صوتی هنگام توقف موسیقی و فعال‌سازی مکانیزم Zero-load در پس‌زمینه.

            - ⚡ **بهبود بوست اجرای بازی و حذف تایم‌اوت (Uncapped Boost Launch):**
              - حذف محدودیت زمانی (تایم‌اوت ۱۲ ثانیه‌ای) پروسه بوست جهت اجرای روان و مطمئن بازی‌های سنگین و لانچرهای جانبی (Steam, Epic Games, EA App).
              - افزایش سقف تایم‌اوت اتصال استیم به ۹۰ ثانیه جهت جلوگیری از خطاهای نابهنگام در سیستم‌های تحت بار سنگین.

            - 🪟 **مدیریت هوشمند وضعیت پنجره هنگام اجرای بازی (Game Launch Window Action):**
              - اضافه شدن گزینه انتخابی به تنظیمات عملکرد (Performance Settings) جهت کنترل رفتار پنجره نکسوس پس از اجرای بازی:
                - پنهان‌سازی پنجره به System Tray (پیش‌فرض)
                - کوچک‌سازی پنجره (Minimize)
                - باز نگه داشتن پنجره (Keep open)

            - 🎯 **فیلترینگ همزمان چندتایی در گیم هاب (Multi-Tag Conjunction Filtering):**
              - امکان انتخاب همزمان چندین ژانر با منطق اشتراک (AND): بازی‌های نمایش‌داده‌شده حتماً تمام فیلترهای انتخابی را دارا خواهند بود.
              - رفع باگ عدم امکان انتخاب مستقیم ژانرهای Action و Role-playing در صفحه اصلی گیم هاب.

            - 🔄 **به‌روزرسانی خودکار درون‌برنامه‌ای (Seamless In-App Auto-Update):**
              - تشخیص و دریافت خودکار پکیج‌های به‌روزرسانی از طریق سرور امن GitHub Releases بدون نیاز به دانلود دستی مجدد.
              - اعتبارسنجی یکپارچه امضای رمزنگاری Minisign (Ed25519) و نصب بدون وقفه در حالت پیش‌زمینه/پس‌زمینه (Passive NSIS).
              - حفظ ۱۰۰٪ داده‌ها، تنظیمات و پایگاه‌داده کاربر در حین به‌روزرسانی.

            ---

            ### 📦 راهنمای نصب و به‌روزرسانی
            - **کاربران فعلی:** در صورت باز بودن لانچر، به‌روزرسانی خودکار فعال شده و کادر ارتقا به نسخه ۰.۲.۰ نمایش داده می‌شود.
            - **نصب مستقیم:** فایل نصبی ویندوز `Nexus_0.2.0_x64-setup.exe` را از لیست **Assets** زیر دانلود کرده و با یک کلیک نصب نمایید.
          releaseDraft: false
          prerelease: false
