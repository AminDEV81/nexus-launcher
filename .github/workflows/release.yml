name: Release & Auto-Update Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate, Lint & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate version synchronization
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const tauri = require('./src-tauri/tauri.conf.json');
            const ref = process.env.GITHUB_REF_NAME || '';
            const tagVer = ref.replace(/^v/, '');
            console.log('Validating versions: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', tag=' + ref);
            if (pkg.version !== tauri.version) {
              console.error('ERROR: Mismatch between package.json (' + pkg.version + ') and tauri.conf.json (' + tauri.version + ')');
              process.exit(1);
            }
            if (ref.startsWith('v') && tagVer !== pkg.version) {
              console.error('ERROR: Git tag (' + ref + ') does not match version in config files (' + pkg.version + ')');
              process.exit(1);
            }
            console.log('Version synchronization check passed: v' + pkg.version);
          "

      - name: Run ESLint / Oxlint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc -b

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend production build
        run: npm run build

  build-and-release:
    name: Build Signed Artifacts & Publish
    needs: validate-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      # Optional Authenticode signing certificate preparation if configured in repository secrets
      - name: Setup Windows Authenticode Certificate (Optional)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          Write-Host "Authenticode certificate secret detected. Decoding certificate..."
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:TEMP\authenticode.pfx", $certBytes)
          Write-Host "Importing certificate into current user store..."
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $pfx.Import("$env:TEMP\authenticode.pfx", $env:WINDOWS_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)

      - name: Prepare Tauri signing key
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RAW_KEY) {
            $cleanKey = $env:RAW_KEY.Trim()
            $keyPath = "$env:RUNNER_TEMP\nexus-updater.key"
            [System.IO.File]::WriteAllText($keyPath, $cleanKey)
            Write-Host "Sanitized signing key written to $keyPath"
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build, Sign and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Launcher v${{ github.ref_name }}'
          releaseBody: |
            # 🚀 Nexus Game Launcher ${{ github.ref_name }}

            به اولین نسخه رسمی لانچر بازی نکسوس خوش آمدید!
            Welcome to the official release of **Nexus Game Launcher**!

            ---

            ### ✨ ویژگی‌ها و قابلیت‌های کلیدی (Key Highlights)

            - 🎮 **کتابخانه هوشمند بازی‌ها (Modern Game Library):**
              - مدیریت، دسته‌بندی و اجرای سریع بازی‌های سیستم
              - دریافت خودکار پوسترها، بنرها و اطلاعات غنی بازی‌ها از IGDB و SteamGridDB
              - رابط کاربری شیشه‌ای، تاریک و با انیمیشن‌های روان و فوق‌سریع

            - ⚡ **تقویت‌کننده هوشمند بازی (Game Booster):**
              - پاک‌سازی پس‌زمینه و بهینه‌سازی منابع سیستم قبل از اجرای بازی
              - اولویت‌بندی هسته‌های CPU و آزادسازی حافظه RAM جهت دستیابی به بالاترین فریم‌ریت (FPS)

            - 🎵 **مرکز موسیقی متن (Soundtrack Center):**
              - جستجو و استریم موسیقی‌های متن بازی‌ها با آرشیو جامع
              - ویژوالایزر صوتی سینماتیک زنده با پاسخگویی فرکانسی

            - 💾 **مدیریت پیشرفته سیو بازی‌ها (Save Game Manager):**
              - شناسایی خودکار پوشه ذخیره‌سازی بیش از ۱۹,۰۰۰ بازی
              - پشتیبان‌گیری، ره‌گیری تغییرات و سیستم ژورنال ریکاوری در برابر خرابی

            - 🔄 **سیستم به‌روزرسانی درون‌برنامه‌ای (In-App Auto-Update):**
              - به‌روزرسانی خودکار و روان در حالت Passive بدون نیاز به دانلود یا نصب دستی مجدد
              - مانیتورینگ زنده دانلود (نمایش مگابایت دریافت‌شده از کل، سرعت پایدار و زمان باقی‌مانده)
              - امضای امنیتی معتبر Minisign (Ed25519) جهت تضمین اصالت و عدم دستکاری فایل‌ها
              - حفظ دائمی و ۱۰۰٪ اطلاعات کاربر، پایگاه داده و تنظیمات در `%APPDATA%`
              - سیستم محافظت در برابر کرش (Crash Guard) جهت بازیابی ایمن

            - 🎨 **موتور استایل و تم (Theme Engine):**
              - تم‌های رنگی مدرن، تایپوگرافی‌های گیمینگ، افکت‌های صوتی تعاملی و تنظیمات عملکردی

            ---

            ### 📦 راهنمای نصب
            فایل نصبی ویندوز `Nexus_0.1.0_x64-setup.exe` را از لیست **Assets** زیر دانلود کرده و با یک کلیک نصب نمایید.
          releaseDraft: false
          prerelease: false
