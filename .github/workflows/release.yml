name: Release & Auto-Update Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate, Lint & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Validate version synchronization
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const tauri = require('./src-tauri/tauri.conf.json');
            const ref = process.env.GITHUB_REF_NAME || '';
            const tagVer = ref.replace(/^v/, '');
            console.log('Validating versions: package.json=' + pkg.version + ', tauri.conf.json=' + tauri.version + ', tag=' + ref);
            if (pkg.version !== tauri.version) {
              console.error('ERROR: Mismatch between package.json (' + pkg.version + ') and tauri.conf.json (' + tauri.version + ')');
              process.exit(1);
            }
            if (ref.startsWith('v') && tagVer !== pkg.version) {
              console.error('ERROR: Git tag (' + ref + ') does not match version in config files (' + pkg.version + ')');
              process.exit(1);
            }
            console.log('Version synchronization check passed: v' + pkg.version);
          "

      - name: Run ESLint / Oxlint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc -b

      - name: Run Prettier check
        run: npm run format:check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Test frontend production build
        run: npm run build

  build-and-release:
    name: Build Signed Artifacts & Publish (${{ matrix.platform }})
    needs: validate-and-test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci || npm install

      # Optional Authenticode signing certificate preparation if configured in repository secrets
      - name: Setup Windows Authenticode Certificate (Optional)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          Write-Host "Authenticode certificate secret detected. Decoding certificate..."
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [System.IO.File]::WriteAllBytes("$env:TEMP\authenticode.pfx", $certBytes)
          Write-Host "Importing certificate into current user store..."
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $pfx.Import("$env:TEMP\authenticode.pfx", $env:WINDOWS_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)

      - name: Prepare Tauri signing key (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:RAW_KEY) {
            $cleanKey = $env:RAW_KEY.Trim()
            $keyPath = "$env:RUNNER_TEMP\nexus-updater.key"
            [System.IO.File]::WriteAllText($keyPath, $cleanKey)
            Write-Host "Sanitized signing key written to $keyPath"
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare Tauri signing key (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$RAW_KEY" ]; then
            CLEAN_KEY="$(echo "$RAW_KEY" | tr -d '\r')"
            KEY_PATH="$RUNNER_TEMP/nexus-updater.key"
            printf "%s" "$CLEAN_KEY" > "$KEY_PATH"
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
          fi

      - name: Build, Sign and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nexus Launcher ${{ github.ref_name }}'
          retryAttempts: 3
          updaterJsonPreferNsis: true
          releaseBody: |
            # 🚀 Nexus Game Launcher ${{ github.ref_name }}

            نسخه رسمی ۰.۴.۰ لانچر نکسوس با هماهنگ‌سازی ابری متادیتا بدون نیاز به کلید IGDB، موتور فیلتر پیشرفته گیم‌هاب، چرخش پویای ۲۴ و ۴۸ ساعته شلف‌ها، عملکرد آفلاین رعدآسا، و سیستم بهبودیافته آپدیتر لینوکس منتشر شد!
            Official release of **Nexus Game Launcher ${{ github.ref_name }}** featuring keyless Nexus Cloud metadata sync, advanced Game Hub filters & smart search, 24h/48h deterministic shelf rotations, blazing-fast offline startup, and polished Linux deb package updater!

            ---

            ### ⚡ ویژگی‌های برجسته نسخه ۰.۴.۰ (What's New in v0.4.0)

            - 🌐 **هماهنگ‌سازی متادیتای ابری بدون نیاز به کلید (Keyless Nexus Cloud Metadata Sync):**
              - امکان سینک متادیتا، کاور، اسکرین‌شات‌ها و آرت‌ورک‌ها از سایدبار و صفحه ویش‌لیست مستقیماً از طریق Nexus Cloud بدون نیاز به ثبت کلید اختصاصی IGDB.

            - 🔍 **موتور فیلتر و جستجوی پیشرفته گیم‌هاب (Hub Filter Engine & Dynamic Search):**
              - فیلترهای نمره (90+ Score)، بازی‌های در راه (Coming Soon)، بازه‌های سال انتشار و مرتب‌سازی به صورت کامل و بلادرنگ هم در حالت مستقیم و هم در حالت Nexus Cloud فعال شدند.

            - 🔄 **چرخش پویا و هوشمند ردیف‌های بازی (Deterministic Shelf Rotations):**
              - شلف **Picked for You** با الگوریتم تصادفی تاریخ‌محور هر ۲۴ ساعت بازی‌های جدیدی از ژانرهای محبوب شما پیشنهاد می‌دهد.
              - شلف **Critically Acclaimed** هر ۴۸ ساعت یک‌بار عناوین شاهکار را نوسازی می‌کند.

            - ⚡ **بهبود سرعت اجرای آفلاین (Blazing-Fast Offline Startup):**
              - کاهش تایم‌اوت شبکه به ۴ ثانیه و بررسی وضعیت Circuit Breaker قبل از ریکوئست شبکه، جهت لود بلادرنگ و بدون معطلی کش آفلاین.

            - 🐧 **راهنمای نصب خودکار در لینوکس و دبیان (Linux & Debian Updater):**
              - شناسایی هوشمند محدودیت مجوز در پکیج‌های `.deb` لینوکس، ارائه دستور ترمینال قابل کپی و اتصال مستقیم به ریلیزهای گیت‌هاب.

            - 🔔 **سیستم پاپ‌آپ و اعلان فوری آپدیت خودکار (Proactive Auto-Updater):**
              - بررسی تضمینی به‌روزرسانی در لحظه راه‌اندازی برنامه و نمایش پاپ‌آپ کامل همراه با اعلان Toast.

            ---

            ### 📦 راهنمای دانلود و نصب (Download & Installation)

            - 🪟 **ویندوز (Windows 10/11 x64):**
              - فایل نصبی `Nexus_0.4.0_x64-setup.exe` را دانلود کرده و با یک کلیک اجرا کنید.
              - کاربران فعلی در صورت باز بودن برنامه، اعلان به‌روزرسانی خودکار درون‌برنامه‌ای را دریافت خواهند کرد.

            - 🐧 **لینوکس (آرچ، مانجارو، استیم‌دک و تمام توزیع‌ها):**
              - فایل `Nexus_0.4.0_amd64.AppImage` را دانلود کرده و دسترسی اجرا دهید:
                ```bash
                chmod +x Nexus_0.4.0_amd64.AppImage
                ./Nexus_0.4.0_amd64.AppImage
                ```
              - برای اوبونتو و دبیان: پکیج `nexus_0.4.0_amd64.deb` را دریافت و با دستور `sudo apt install ./nexus_0.4.0_amd64.deb` یا `sudo dpkg -i nexus_0.4.0_amd64.deb` نصب کنید.
              - برای فدورا و ردهت: پکیج `Nexus-0.4.0-1.x86_64.rpm` را دریافت و با دستور `sudo dnf install ./Nexus-0.4.0-1.x86_64.rpm` نصب کنید.
          releaseDraft: false
          prerelease: false
